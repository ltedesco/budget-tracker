# Builds the budget tracker and publishes it to GitHub Pages.
#
# GitHub Pages serves from a public repository on free accounts; a private
# repository needs GitHub Pro or Team. The data file is NOT part of this build —
# it lives in a private repo and is fetched at runtime through the Contents API.

# Actions are pinned to commit SHAs, not tags. A tag is a movable pointer: if
# one were repointed at malicious code, it would run here with write access to
# the published site — and this site holds a credential in the visitor's
# browser. A SHA cannot be moved. The trailing comment records which version
# each SHA is, so they can be bumped deliberately; they will not update on
# their own, which is the point.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # A red build must not reach Pages: the merge logic is what stops two
      # devices overwriting each other's budget.
      - name: Run tests
        run: npm test

      # enablement: true turns Pages on the first time this runs, so the
      # repo's Pages setting does not have to be flipped by hand.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
